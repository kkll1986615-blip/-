<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#064b30">
<link rel="manifest" href="./manifest.webmanifest">
<title>تثبيت المنصة الرياضية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;font-family:Tahoma,Arial,sans-serif;color:#17202a}
.wrap{max-width:560px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 35px #0001;text-align:center;border-top:6px solid #0b6b43}
.logo{width:110px;height:110px;border-radius:28px;margin:auto auto 16px;display:block}
h1{margin:8px 0;color:#064b30}p{line-height:1.8;color:#555}
button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin:12px 0;font-size:17px;font-weight:bold;text-decoration:none;cursor:pointer}
.primary{background:#0b6b43;color:#fff}.secondary{background:#eef3f1;color:#064b30}
.note{font-size:13px;background:#f8faf9;padding:12px;border-radius:12px;margin-top:18px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<img class="logo" src="./icons/icon-192.png" alt="المنصة الرياضية">
<h1>المنصة الرياضية</h1>
<p>برنامج تثبيت المنصة على الهاتف كبرنامج مستقل.</p>
<button id="install" class="primary">📲 تثبيت المنصة</button>
<a class="btn secondary" href="./index.html">▶️ فتح المنصة</a>
<div id="help" class="note hidden"></div>
</div></div>
<script>
let deferredPrompt=null;
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.getElementById('install').addEventListener('click',async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    return;
  }
  const h=document.getElementById('help'); h.classList.remove('hidden');
  h.textContent='إذا لم يظهر التثبيت تلقائيًا: افتح قائمة المتصفح ⋮ ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». يجب فتح الموقع عبر HTTPS.';
});
window.addEventListener('appinstalled',()=>{document.getElementById('install').textContent='✅ تم تثبيت المنصة';});
</script>
</body>
</html>
